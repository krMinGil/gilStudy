<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.wrap {
    position: relative;
    width: 500px;
    height: 700px;
    margin: 0 auto;
    border: 1px solid #ccc;
    border-radius: 15px;
}

/* ------------- [header] ------------- */
header {
    width: 80%;
    height: 150px;
    line-height: 150px;
    margin: 50px auto 120px;
    text-align: center;
    font-size: 90px;
    font-weight: 700;
    cursor: default;
    color: rgb(48, 140, 210);
}

/* ------------- [main] ------------- */
main {
    display: flex;
    flex-direction: column;
    padding: 0 20px;
}

.loginBox {
    position: relative;
    margin: 0 0 25px;
}

.inputLogin {
    width: 100%;
    height: 45px;
    font-size: 22px;
    padding-right: 35px;
    background: transparent;
    outline: none;
    border: none;
    border-bottom: 1.5px solid #e5e5e5;
}

.inputLogin:focus {
    border-bottom-color: rgb(48, 140, 210);
}

/* ID/PW 라벨 기본 위치 */
.loginBox > span {
    color: #787676;
    position: absolute;
    left: 5px;
    top: 12px;
    pointer-events: none;
    transition: all 0.2s ease;
}

/* 포커스 되거나 값이 있을 때 라벨 이동 */
.inputLogin:focus + span,
.loginBox.has-value > span {
    top: -10px;
    font-size: 12px;
    color: rgb(209, 210, 212);
    font-weight: 600;
}

/* input창 초기화 버튼 */
.btnClear {
    display: none;
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background-color: #ccc;
    color: #fff;
    border: none;
    font-size: 12px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
}

/* 값이 있을 때만 X 버튼 표시 */
.loginBox.has-value .btnClear {
    display: flex;
}
/* sign in 버튼 */
.signIn {
    width: 100%;
    height: 50px;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    background-color: rgb(64, 155, 197);
    border: none;
    border-radius: 10px;
    margin: 20px auto;
    cursor: pointer;
}
.signIn:hover {
    background-color: rgb(75, 168, 212);
}
.signIn:active {
    background-color: rgb(62, 153, 196);
}
/* ------------- [footer] ------------- */
footer{
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 35%;
    margin: 15px auto 0;
}
.fgStyle{
    font-size: 12px;
    color: #969494;
    display: block;
    cursor: pointer;
}
input[type="radio"]{
    display: none;
}
.fg_id{

}
.fg_pw{
    
}
.boxLine{
    background-color: #969494;
    width: 1px;
    font-size: 10px;
    height: 15px;
}

/* 힌트 박스 (alertBox 디자인 적용) */
.hintBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 360px;
    padding: 30px 20px;
    background: #fff;
    border: 2px solid rgb(64, 155, 197);
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: transform 0.2s ease;
    z-index: 10;
}
.hintText {
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-align: center;
}
.btnHintConfirm {
    padding: 10px 30px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background-color: rgb(64, 155, 197);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.btnHintConfirm:hover {
    background-color: rgb(75, 168, 212);
}

#fg_id:checked ~ .hintId{
    transform: translate(-50%, -50%) scale(1);
}
#fg_pw:checked ~ .hintPw{
    transform: translate(-50%, -50%) scale(1);
}

/* 경고창 박스 */
.alertBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 360px;
    padding: 30px 20px;
    background: #fff;
    border: 2px solid rgb(64, 155, 197);
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: transform 0.2s ease;
    z-index: 10;
}
.alertBox.active {
    transform: translate(-50%, -50%) scale(1);
    
}
.alertText {
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-align: center;
    word-break: keep-all;
}
.btnAlertConfirm {
    padding: 10px 30px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background-color: rgb(64, 155, 197);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.btnAlertConfirm:hover {
    background-color: rgb(75, 168, 212);
}
</style>
</head>

<!-- ================================================================== -->
<body>
    <div class="wrap">
        <header>gilStudy</header>
        <main>
            <div class="loginBox">
                <input type="text" class="inputLogin" id="uId" spellcheck="false">
                <span>ID or phone number</span>
                <button type="button" class="btnClear" tabindex="-1">✕</button>
            </div>
            <div class="loginBox">
                <input type="password" class="inputLogin" id="uPw" spellcheck="false">
                <span>Password</span>
                <button type="button" class="btnClear" tabindex="-1">✕</button>
            </div>
            <input type="submit" value="sign in" class="signIn" onclick="login()">
        </main>

        <input type="radio" name="fg" id="fg_id">
        <input type="radio" name="fg" id="fg_pw">
        <footer>
            <label for="fg_id" class="fgStyle">Forgot ID</label>
            <div class="boxLine"></div>
            <label for="fg_pw" class="fgStyle">Forgot Password</label>
        </footer>

        <!-- hint -->
        <div class="hintId hintBox">
            <div class="hintText">hint: 123</div>
            <button type="button" class="btnHintConfirm">확인</button>
        </div>
        <div class="hintPw hintBox">
            <div class="hintText">hint: 456</div>
            <button type="button" class="btnHintConfirm">확인</button>
        </div>

        <!-- 커스텀 경고창 -->
        <div class="alertBox" id="alertBox">
            <div class="alertText" id="alertText"></div>
            <button type="button" class="btnAlertConfirm" id="btnAlertConfirm">확인</button>
        </div>
    </div>

<script>
// 경고창 띄우기 함수
function showAlert(message) {
    const alertBox = document.querySelector('#alertBox');
    const alertText = document.querySelector('#alertText');
    alertText.textContent = message;
    alertBox.classList.add('active');
}

// 경고창 닫기 함수
function closeAlert() {
    const alertBox = document.querySelector('#alertBox');
    alertBox.classList.remove('active');
}

// signIn 누르면 로그인
function login(){
    let uId = document.querySelector('#uId').value;
    let uPw = document.querySelector('#uPw').value;
    if(uId=="123" && uPw=="456"){
        location.href = "selectMenu.html";
    }
    else if(uId=="" || uPw=="" ){
        showAlert("ID와 Password를 입력해주세요.");
    }
    else{
        showAlert("ID와 Password가 맞지 않습니다.");
    }
    console.log(`${uId}/ ${uPw}`);
}

document.addEventListener('DOMContentLoaded', () => {
    // 경고창 확인 버튼 클릭 시 닫기
    document.querySelector('#btnAlertConfirm').addEventListener('click', closeAlert);

    // 힌트 박스 확인 버튼 클릭 시 라디오 체크 해제
    document.querySelectorAll('.btnHintConfirm').forEach(btn => {
        btn.addEventListener('click', () => {
            const checkedRadio = document.querySelector('input[name="fg"]:checked');
            if (checkedRadio) {
                checkedRadio.checked = false;
            }
        });
    });

    // 1. 인풋 X버튼 클릭 시 값 초기화
    document.querySelectorAll('.loginBox').forEach(box => {
        const input = box.querySelector('.inputLogin');
        const btnClear = box.querySelector('.btnClear');

        const updateState = () => box.classList.toggle('has-value', Boolean(input.value));

        input.addEventListener('input', updateState);
        updateState();

        btnClear.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = '';
            updateState();
            input.focus();
        });
    });
});
</script>
</body>
</html>
