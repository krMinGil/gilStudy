<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
<style>
@view-transition {
    navigation: auto;
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.wrap {
    position: relative;
    width: 500px;
    height: 700px;
    margin: 0 auto;
    border: 1px solid #ccc;
    border-radius: 15px;
}

/* ------------- [header] ------------- */
header {
    width: 80%;
    height: 150px;
    line-height: 150px;
    margin: 50px auto 120px;
    text-align: center;
    font-size: 90px;
    font-weight: 700;
    cursor: default;
    color: rgb(48, 140, 210);
}

/* ------------- [main] ------------- */
main {
    display: flex;
    flex-direction: column;
    padding: 0 20px;
}

.loginBox {
    position: relative;
    margin: 0 0 25px;
}

.inputLogin {
    width: 100%;
    height: 45px;
    font-size: 22px;
    padding-right: 35px;
    background: transparent;
    outline: none;
    border: none;
    border-bottom: 1.5px solid #e5e5e5;
}

.inputLogin:focus {
    border-bottom-color: rgb(48, 140, 210);
}

/* ID/PW 라벨 기본 위치 */
.loginBox > span {
    color: #787676;
    position: absolute;
    left: 5px;
    top: 12px;
    pointer-events: none;
    transition: all 0.2s ease;
}

/* 포커스 되거나 값이 있을 때 라벨 이동 */
.inputLogin:focus + span,
.loginBox.has-value > span {
    top: -10px;
    font-size: 12px;
    color: rgb(209, 210, 212);
    font-weight: 600;
}

/* input창 초기화 버튼 */
.btnClear {
    display: none;
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background-color: #ccc;
    color: #fff;
    border: none;
    font-size: 12px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
}

/* 값이 있을 때만 X 버튼 표시 */
.loginBox.has-value .btnClear {
    display: flex;
}
/* sign in 버튼 */
.signIn {
    width: 100%;
    height: 50px;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    background-color: rgb(64, 155, 197);
    border: none;
    border-radius: 10px;
    margin: 20px auto;
    cursor: pointer;
}
.signIn:hover {
    background-color: rgb(75, 168, 212);
}
.signIn:active {
    background-color: rgb(62, 153, 196);
}

/* 경고창 박스 */
.alertBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 360px;
    padding: 30px 20px;
    background: #fff;
    border: 2px solid rgb(64, 155, 197);
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: transform 0.2s ease;
    z-index: 10;
}
.alertBox.active {
    transform: translate(-50%, -50%) scale(1);
}
.alertText {
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-align: center;
    word-break: keep-all;
}
.btnAlertConfirm {
    padding: 10px 30px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background-color: rgb(64, 155, 197);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.btnAlertConfirm:hover {
    background-color: rgb(75, 168, 212);
}
</style>
</head>

<!-- ================================================================== -->
<body onselectstart="return false">
    <div class="wrap">
        <header>gilStudy</header>
        <main>
            <div class="loginBox">
                <input type="email" class="inputLogin" id="uId" spellcheck="false" autocomplete="username">
                <span>Email</span>
                <button type="button" class="btnClear" tabindex="-1">✕</button>
            </div>
            <div class="loginBox">
                <input type="password" class="inputLogin" id="uPw" spellcheck="false" autocomplete="current-password">
                <span>Password</span>
                <button type="button" class="btnClear" tabindex="-1">✕</button>
            </div>
            <input type="button" value="sign in" class="signIn" onclick="login()">
        </main>

        <!-- 커스텀 경고창 -->
        <div class="alertBox" id="alertBox">
            <div class="alertText" id="alertText"></div>
            <button type="button" class="btnAlertConfirm" id="btnAlertConfirm">확인</button>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="dataStore.js"></script>
<script>
// 경고창 띄우기 함수
function showAlert(message) {
    const alertBox = document.querySelector('#alertBox');
    const alertText = document.querySelector('#alertText');
    alertText.textContent = message;
    alertBox.classList.add('active');
}

// 경고창 닫기 함수
function closeAlert() {
    const alertBox = document.querySelector('#alertBox');
    alertBox.classList.remove('active');
}

// Supabase Auth로 로그인. 성공하면 메뉴 화면으로 이동한다.
async function login() {
    const email = document.querySelector('#uId').value.trim();
    const password = document.querySelector('#uPw').value.trim();

    if (email === "" || password === "") {
        showAlert("이메일과 비밀번호를 입력해주세요.");
        return;
    }

    const { error } = await DataStore.signIn(email, password);
    if (error) {
        showAlert("이메일 또는 비밀번호가 맞지 않습니다.");
        return;
    }

    location.href = "selectMenu.html";
}

// 이미 로그인된 세션이 남아있으면 로그인 화면을 건너뛰고 바로 메뉴로 이동
(async () => {
    const session = await DataStore.getSession();
    if (session) location.href = "selectMenu.html";
})();

document.addEventListener('DOMContentLoaded', () => {
    // 경고창 확인 버튼 클릭 시 닫기
    document.querySelector('#btnAlertConfirm').addEventListener('click', closeAlert);

    document.querySelectorAll('.loginBox').forEach(box => {
        const input = box.querySelector('.inputLogin');
        const btnClear = box.querySelector('.btnClear');

        const updateState = () => box.classList.toggle('has-value', Boolean(input.value));

        input.addEventListener('input', updateState);
        updateState();

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        btnClear.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = '';
            updateState();
            input.focus();
        });
    });
});
</script>
</body>
</html>
