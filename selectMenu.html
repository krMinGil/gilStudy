<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selectMenu</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.wrap {
    width: 500px;
    height: 700px;
    margin: 0 auto;
    border: 1px solid #ccc;
    border-radius: 15px;
    background-color: #fff;
}
header {
    width: 80%;
    height: 150px;
    line-height: 150px;
    margin: 50px auto 40px;
    text-align: center;
    font-size: 90px;
    font-weight: 700;
    cursor: default;
    color: rgb(48, 140, 210);
}
    main{
        width: 80%;
        height: 65%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        border-top: 1px solid #ccc;
    }

    a {
        width: 100%;
        height: calc(95% / 8);
        margin: 0 auto;
        text-decoration: none;
        color: #4175ac;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 500;
        border-radius: 5px;
    }

    /* 마우스 올렸을 때 */
    a:hover {
        background-color: rgb(194, 212, 225);
    }

    /* 클릭했을 때 (실제 버튼이 눌리는 효과) */
    a:active {
        transform: translateY(2px);
    }
</style>
</head>
<body onselectstart="return false">
    <div class="wrap">
        <header>gilStudy</header>
        <main>
        <a href="Html.html">HTML & CSS</a>
        <a href="Js.html">JS</a>
        <a href="#">--</a>
        <a href="#">--</a>
        <a href="Godot.html">Godot</a>
        <a href="Ai_Handle.html">Ai_handle</a>
        <a href="Claude.html">Claude</a>
        <a href="PlanDesign.html">PlanDesign</a>
        </main>
    </div>
</body>
</html>
