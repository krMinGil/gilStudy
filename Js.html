<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
    <style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
        width: 95vw;
        height: 95vh;
        margin: 2.5vh auto;
        border: 1px solid #ccc;
        border-radius: 15px;
        background-color: #fff;
        position: relative;
        display: flex;
        flex-direction: column;
    }
    header {
        height: 90px;
        line-height: 90px;
        margin: 50px auto 50px;
        text-align: center;
        font-size: 75px;
        font-weight: 700;
        cursor: pointer;
        color: rgba(25, 36, 117, 0.316);
        flex-shrink: 0;
    }
    header:hover{
        color: #7b9ab2;
    }
    
    .lineBox1{
        width: 100%;
        height: 0.5px;
        background: #ccc;
        margin: 0 auto;
    }
    /* Controller Bar (검색, 정렬, New 버튼) */
    .control-bar {
        width: 95%;
        margin: 5px auto 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .search-sort-group {
        display: flex;
        gap: 8px;
        align-items: center;
        flex: 0.5;
        max-width: 250px;
    }
    .search-input {
        width: 100%;
        padding: 6px 12px;
        font-size: 9px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        outline: none;
        transition: box-shadow 0.2s;
    }
    .search-input:focus {
        box-shadow: 0 0 0 1px rgba(31, 128, 203, 0.713);
    }
    .sort-select {
        padding: 6px 10px;
        font-size: 9px;
        color: #4b5563;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        outline: none;
        background-color: #fff;
        cursor: pointer;
    }
    .btnNew {
        padding: 6px 16px;
        background-color: #fff;
        color: #6d6c6c;
        border: none;
        box-shadow: 0 0 0 1px #e7e6e6;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }
    .btnNew:hover {
        background: #faf7f7;
    }
    .btnNew:active {
        transform: translateY(1px);
    }

    .lineBox2 {
        width: 100%;
        height: 1px;
        margin: 0 auto 15px;
        background-color: #ccc;
        flex-shrink: 0;
    }

    /* main 영역 */
    main {
        width: 95%;
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        position: relative;
        margin: 0 auto;
        overflow-y: auto;
    }

    /* 검색 결과 없음 안내 */
    .no-results {
        width: 100%;
        padding: 40px 0;
        text-align: center;
        color: #888;
        font-size: 15px;
    }

    /* title 목록 항목 */
    .title {
        width: calc(100% / 5);
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        padding: 0 2%;
        overflow: hidden;
        color: #308cd2;
        border-right: 1px solid #e0dede;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }

    @media screen and (min-width: 1025px) and (max-width: 2000px) {
        .title { width: calc(100% / 5); }
        .title:nth-child(5n) { border-right: none; }
    }
    @media screen and (min-width: 601px) and (max-width: 1024px) {
        .title { width: calc(100% / 4); }
        .title:nth-child(4n) { border-right: none; }
    }
    @media screen and (max-width: 600px) {
        .title { width: calc(100% / 3); }
        .title:nth-child(3n) { border-right: none; }
    }
    
    .title:hover {
        background: #67a9e7;
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
    }

    /* 페이지네이션 스타일 */
    .pagination {
        width: 95%;
        margin: 15px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
    }
    .page-btn {
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background-color: #fff;
        color: #2d83af;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .page-btn:hover:not(:disabled) {
        background-color: #67a9e7;
        color: #fff;
        border-color: #67a9e7;
    }
    .page-btn.active {
        background-color: #308cd2;
        color: #fff;
        border-color: #308cd2;
        font-weight: 700;
    }
    .page-btn:disabled {
        color: #ccc;
        border-color: #eee;
        cursor: not-allowed;
    }

    /* 상세 페이지 레이아웃 */
    .detailView {
        width: 100%;
        height: 100%;
        padding: 10px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .detailHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .detailTitleInput {
        font-size: 18px;
        font-weight: 700;
        color: #2d83af;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 6px 12px;
        outline: none;
        width: 60%;
        transition: box-shadow 0.5s;
    }
    .detailTitleInput:focus {
        box-shadow: 0 0 0 1px rgba(20, 51, 74, 0.709);
    }
    .detailTopBtns {
        display: flex;
        gap: 8px;
    }
    .btnTopAction {
        padding: 6px 14px;
        background-color: #fff;
        color: #6d6c6c;
        border: none;
        box-shadow: 0 0 0 1px #e7e6e6;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s ease;
    }
    .btnTopAction:hover {
        background: #faf7f7;
    }
    .btnTopAction.btnDelete:hover {
        background: #fee2e2;
        color: #dc2626;
        box-shadow: 0 0 0 1px #fca5a5;
    }

    .detailBody {
        flex: 1;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
    }
    .detailText {
        font-size: 15px;
        line-height: 1.6;
        color: #333;
        white-space: pre-wrap;
        word-break: break-all;
    }
    
    /* 실시간 서식 편집용 편집기 박스 (contenteditable) */
    .editable-box {
        width: 100%;
        height: 100%;
        min-height: 200px;
        padding: 12px;
        font-size: 15px;
        line-height: 1.6;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        outline: none;
        overflow-y: auto;
        background-color: #fff;
        font-family: inherit;
        white-space: pre-wrap;
        word-break: break-all;
        transition: box-shadow 0.5s;
    }
    .editable-box:focus {
        box-shadow: 0 0 0 1px rgba(20, 51, 74, 0.709);
    }
    .editable-box:empty:before {
        content: attr(data-placeholder);
        color: #aaa;
        pointer-events: none;
        display: block;
    }

    .detailFooter {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .btnBack {
        padding: 8px 16px;
        background-color: #308cd2;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .btnBack:hover {
        background-color: #2570a8;
    }
    .btnSave {
        background-color: #28a745;
    }
    .btnSave:hover {
        background-color: #218838;
    }

    /* 서식 툴바 스타일 (제목 입력 박스와 너비/우측 라인을 맞추기 위해 60%로 통일) */
    .format-toolbar {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        width: 60%;
    }
    .fmt-btn {
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        transition: background 0.2s;
        flex: 3 1 auto;
        text-align: center;
    }
    .fmt-btn:hover {
        background: #f3f4f6;
    }
    .fmt-divider {
        color: #ccc;
        font-size: 14px;
    }
    .fmt-select {
        padding: 4px 8px;
        font-size: 12px;
        color: #333;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
    }
    .fmt-color-group {
        display: flex;
        gap: 5px;
        align-items: center;
        flex: 1 1 auto;
        justify-content: space-between;
    }
    .fmt-color-swatch {
        width: 20px;
        height: 20px;
        padding: 0;
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    .fmt-color-swatch:hover {
        transform: scale(1.2);
    }

    /* 위키 링크 스타일 ([[]]) */
    .wiki-link {
        text-decoration: underline;
        color: #308cd2;
        cursor: pointer;
        font-weight: 500;
    }
    .wiki-link:hover {
        color: #2570a8;
        background-color: rgba(48, 140, 210, 0.1);
        border-radius: 3px;
    }

    /* 모달 스타일 */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(3px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
        display: flex;
        opacity: 1;
    }
    .modal-box {
        background: #ffffff;
        width: 420px;
        padding: 25px 20px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        transform: translateY(-20px);
        transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-box {
        transform: translateY(0);
    }
    .modal-title {
        margin: 0 0 15px 0;
        font-size: 20px;
        font-weight: 700;
        color: #308cd2;
        text-align: center;
    }
    .modal-input {
        width: 100%;
        padding: 10px 14px;
        font-size: 15px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        outline: none;
        transition: box-shadow 0.5s;
    }
    .modal-input:focus {
        box-shadow: 0 0 0 1px rgba(20, 51, 74, 0.709);
    }
    .modal-textarea {
        width: 100%;
        height: 120px;
        margin-top: 10px;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.5;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        outline: none;
        resize: none;
        font-family: inherit;
        transition: box-shadow 0.5s;
    }
    .modal-textarea:focus {
        box-shadow: 0 0 0 1px rgba(20, 51, 74, 0.709);
    }
    .modal-btns {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
    }
    .btn-modal {
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-cancel {
        background-color: #f3f4f6;
        color: #4b5563;
    }
    .btn-cancel:hover {
        background-color: #e5e7eb;
    }
    .btn-submit {
        background-color: #308cd2;
        color: #ffffff;
    }
    .btn-submit:hover {
        background-color: #2570a8;
    }
    .btn-delete-confirm {
        background-color: #dc2626;
        color: #ffffff;
    }
    .btn-delete-confirm:hover {
        background-color: #b91c1c;
    }

    /* 로고 스타일 */
    .logo-link {
        position: absolute;
        top: 20px;
        left: 25px;
        font-size: 20px;
        font-weight: 700;
        color: #308cd2;
        text-decoration: none;
        cursor: pointer;
        z-index: 10;
    }
    .logo-link:hover {
        color: #7bacd2;
    }
    </style>
</head>
<body>
<div class="wrap">
    <div class="headBox" onselectstart="return false">
        <a class="logo-link" onclick="location.href='selectMenu.html'">gilStudy</a>
        <header id="headerTitle">Js</header>
    </div>
    <div class="lineBox1"></div>
    <div class="control-bar" id="controlBar">
        <div class="search-sort-group">
            <input type="text" class="search-input" id="searchInput" placeholder="제목 검색...">
            <select class="sort-select" id="sortSelect">
                <option value="oldest">오래된순</option>
                <option value="newest">최신순</option>
                <option value="title">이름순</option>
            </select>
        </div>
        <button class="btnNew" id="btnNew">New</button>
    </div>

    <div class="lineBox2"></div>
    <main id="mainContent">
        </main>

    <div class="pagination" id="paginationBar"></div>
</div>

<div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal-box">
        <h3 class="modal-title" style="color: #dc2626;">항목 삭제</h3>
        <p id="deleteModalText" style="text-align: center; font-size: 15px; color: #4b5563; margin: 15px 0;"></p>
        <div class="modal-btns">
            <button class="btn-modal btn-cancel" id="btnDeleteCancel">취소</button>
            <button class="btn-modal btn-delete-confirm" id="btnDeleteConfirm">삭제</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="wordMemoModalOverlay">
    <div class="modal-box" style="width: 470px;">
        <h3 class="modal-title" id="wordMemoModalTitle">단어 메모</h3>
        <div id="wordMemoContainer"></div>
        <div class="modal-btns" id="wordMemoBtns"></div>
    </div>
</div>

<script>
    const defaultList = Array(1).fill("js");
    const STORAGE_KEY = "gilStudy_js_items";

    let currentPage = 1;
    let targetDeleteId = null;
    let activeDetailId = null;
    let currentEditingWord = null;
    let isMemoEditing = false;

    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const controlBar = document.getElementById("controlBar");
    const paginationBar = document.getElementById("paginationBar");
    
    const deleteModalOverlay = document.getElementById("deleteModalOverlay");
    const deleteModalText = document.getElementById("deleteModalText");
    const btnDeleteCancel = document.getElementById("btnDeleteCancel");
    const btnDeleteConfirm = document.getElementById("btnDeleteConfirm");

    const wordMemoModalOverlay = document.getElementById("wordMemoModalOverlay");
    const wordMemoModalTitle = document.getElementById("wordMemoModalTitle");

    // 서식 적용 전 선택 영역 저장 (색상 피커 등 포커스가 이동하는 컨트롤 대응)
    let savedSelectionRange = null;

    function saveCurrentSelection(elementId) {
        const editor = document.getElementById(elementId);
        const selection = window.getSelection();
        if (selection.rangeCount > 0 && editor.contains(selection.anchorNode)) {
            savedSelectionRange = selection.getRangeAt(0).cloneRange();
        }
    }

    function restoreSavedSelection() {
        if (!savedSelectionRange) return;
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(savedSelectionRange);
    }

    // 드래그로 블록이 씌워진 상태(선택 영역이 있는 상태)에서만 서식 적용을 허용
    function requireDragSelection(elementId) {
        const editor = document.getElementById(elementId);
        const selection = window.getSelection();
        if (!selection.rangeCount || selection.isCollapsed) {
            alert("서식을 적용할 텍스트를 드래그하여 선택해주세요.");
            return false;
        }
        const range = selection.getRangeAt(0);
        if (!editor.contains(range.commonAncestorContainer)) return false;
        return true;
    }

    // 굵기 토글 (드래그 선택된 텍스트에만 적용)
    function toggleBold(elementId) {
        if (!requireDragSelection(elementId)) return;
        const editor = document.getElementById(elementId);
        editor.focus();
        document.execCommand("bold", false, null);
    }

    // 선택 영역 안에 이미 각기 다른 font-size가 적용된 태그가 섞여 있으면,
    // 그 태그들의 인라인 font-size가 바깥쪽 span보다 우선 적용되어 일부 글자만 크기가
    // 안 바뀐 것처럼 보이는 문제가 생긴다. 새 크기를 씌우기 전에 하위 요소의 font-size를
    // 모두 제거해서, 선택된 글자 전체가 예외 없이 새 크기 하나로 통일되게 한다.
    function stripNestedFontSize(node) {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (node.style && node.style.fontSize) {
            node.style.removeProperty("font-size");
        }
        Array.from(node.childNodes).forEach(stripNestedFontSize);
    }

    // 선택한 글자 크기 적용 (드래그된 텍스트를 span으로 감쌈)
    function applyFontSize(elementId, sizePx) {
        const editor = document.getElementById(elementId);
        editor.focus();
        restoreSavedSelection();
        if (!requireDragSelection(elementId)) return;

        const selection = window.getSelection();
        const range = selection.getRangeAt(0);

        const extracted = range.extractContents();
        Array.from(extracted.childNodes).forEach(stripNestedFontSize);

        const span = document.createElement("span");
        span.style.fontSize = sizePx + "px";
        span.appendChild(extracted);
        range.insertNode(span);

        selection.removeAllRanges();
        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        selection.addRange(newRange);
    }

    // 선택한 글자 색상 적용 (드래그된 텍스트에만 적용)
    // 색상 버튼은 굵게 버튼과 동일하게 onmousedown에서 기본 동작을 막아 클릭해도 선택 영역이
    // 절대 풀리지 않으므로(포커스 이동 자체가 없음), saveCurrentSelection/restoreSavedSelection로
    // 선택 영역을 저장했다가 복원할 필요가 없다. (예전 네이티브 색상 피커는 포커스가 옮겨가면서
    // 선택 영역을 저장/복원해야 했는데, 이 과정에서 range가 가리키는 노드가 execCommand로 인해
    // 바뀌어버려 두 번째 호출부터 복원이 깨지는 문제가 있었음 — 이 방식은 그 문제 자체가 없다.)
    function applyColor(elementId, colorValue) {
        if (!requireDragSelection(elementId)) return;
        const editor = document.getElementById(elementId);
        editor.focus();
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("foreColor", false, colorValue);
    }

    // 커서가 실제 서식 태그(굵게/색상/크기) 안에 있는지 검사.
    // 줄바꿈으로 브라우저가 자동 생성하는 <div> 같은 일반 래퍼는 서식이 아니므로 제외해야
    // 방향키로 커서만 이동할 때 매번 보이지 않는 문자가 삽입되어 기본 이동 동작이 깨지는 걸 막을 수 있음.
    function isInsideFormatting(node, editor) {
        while (node && node !== editor) {
            if (node.nodeType === Node.ELEMENT_NODE) {
                const tag = node.tagName;
                if (tag === "B" || tag === "STRONG" || tag === "FONT") return true;
                if (tag === "SPAN" && node.hasAttribute("style")) return true;
            }
            node = node.parentNode;
        }
        return false;
    }

    // 우리가 직접 selection을 조작하는 도중에 발생하는 selectionchange가
    // 이 함수를 재귀적으로 다시 부르는 것을 막기 위한 재진입 방지 플래그
    let isResettingTypingStyle = false;

    function resetTypingStyleIfCollapsed(elementId) {
        if (isResettingTypingStyle) return;
        const editor = document.getElementById(elementId);
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        if (!editor.contains(selection.anchorNode)) return;
        if (!selection.isCollapsed) return;
        if (!isInsideFormatting(selection.anchorNode, editor)) return;

        isResettingTypingStyle = true;
        editor.focus();
        try {
            // 커서 위치에 보이지 않는 문자를 하나 입력한 뒤, 그 한 글자만 선택해서
            // removeFormat을 적용하면 브라우저가 굵기/색상/크기 태그를 올바르게 쪼개준다.
            // (DOM에 직접 노드를 끼워 넣으면 기존 서식 태그 안에 그대로 갇혀버려 효과가 없다.)
            document.execCommand("insertText", false, "​");

            // 방금 넣은 글자 하나만 range 좌표로 바로 선택 (레이아웃 계산이 필요한
            // selection.modify 대신 오프셋 계산만 사용해 지연 없이 즉시 처리)
            const afterRange = selection.getRangeAt(0);
            const markRange = document.createRange();
            markRange.setStart(afterRange.endContainer, afterRange.endOffset - 1);
            markRange.setEnd(afterRange.endContainer, afterRange.endOffset);
            selection.removeAllRanges();
            selection.addRange(markRange);

            document.execCommand("styleWithCSS", false, true);
            document.execCommand("foreColor", false, "black");
            document.execCommand("removeFormat", false, null);
            selection.collapseToEnd();
        } catch (e) {
        } finally {
            isResettingTypingStyle = false;
        }
    }

    // 블록(드래그 선택)이 씌워진 상태가 아니라면 언제든(마우스 클릭, 방향키, Home/End 등
    // 어떤 방식으로 커서가 옮겨지든) 자동으로 기본 서식으로 리셋되도록 selectionchange를 감시.
    // 단, 드래그가 "시작"되는 mousedown 순간에는 커서가 클릭 지점에 먼저 collapse되므로,
    // 그 찰나에 리셋이 끼어들어 드래그 시작 지점의 서식을 깨뜨리지 않도록 드래그 중에는 무시한다.
    let isDraggingInEditor = false;
    let selectionAutoResetElementId = null;

    function handleSelectionAutoReset() {
        if (isDraggingInEditor) return;
        if (!selectionAutoResetElementId) return;
        const editor = document.getElementById(selectionAutoResetElementId);
        if (!editor) return;
        // 글자 크기/색상 드롭다운·컬러피커 등 툴바 컨트롤을 조작하는 중에는 그쪽이 포커스를
        // 가지고 있어야 정상 동작한다(특히 <select>는 포커스를 뺏기면 옵션을 고르기도 전에
        // 드롭다운이 닫혀버림). 편집기가 실제로 포커스를 갖고 있을 때만 리셋을 적용해서
        // 이 리스너가 툴바 조작을 방해하지 않도록 한다.
        if (document.activeElement !== editor) return;
        resetTypingStyleIfCollapsed(selectionAutoResetElementId);
    }

    function handleEditorMouseDown() {
        isDraggingInEditor = true;
    }

    function handleEditorMouseUp() {
        isDraggingInEditor = false;
        handleSelectionAutoReset();
    }

    function bindSelectionAutoReset(elementId) {
        unbindSelectionAutoReset();
        selectionAutoResetElementId = elementId;
        const editor = document.getElementById(elementId);
        if (!editor) return;
        editor.addEventListener("mousedown", handleEditorMouseDown);
        document.addEventListener("mouseup", handleEditorMouseUp);
        document.addEventListener("selectionchange", handleSelectionAutoReset);
    }

    function unbindSelectionAutoReset() {
        if (!selectionAutoResetElementId) return;
        const editor = document.getElementById(selectionAutoResetElementId);
        if (editor) editor.removeEventListener("mousedown", handleEditorMouseDown);
        document.removeEventListener("mouseup", handleEditorMouseUp);
        document.removeEventListener("selectionchange", handleSelectionAutoReset);
        selectionAutoResetElementId = null;
        isDraggingInEditor = false;
    }

    // [[]] 단어 파싱 및 위키 링크 변환 함수
    function parseWikiLinks(content) {
        if (!content) return "";
        return content.replace(/\[\[(.*?)\]\]/g, (match, word) => {
            const cleanWord = word.trim();
            return `<span class="wiki-link" data-word="${cleanWord}">${cleanWord}</span>`;
        });
    }

    function getStoredItems() {
        const stored = localStorage.getItem(STORAGE_KEY);
        let items = [];
        
        if (stored !== null) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    items = parsed.map((item, index) => {
                        if (typeof item === "string") {
                            return { 
                                id: Date.now() + index,
                                title: item, 
                                content: `이곳은 ${item} 항목의 상세 내용 영역입니다.`, 
                                memos: {} 
                            };
                        }
                        if (item.id === undefined || item.id === null) {
                            item.id = Date.now() + index;
                        }
                        return item;
                    });
                }
            } catch (e) {
                console.error("로컬 스토리지 파싱 오류:", e);
            }
        }
        
        if (items.length === 0) {
            items = defaultList.map((title, index) => ({
                id: Date.now() + index,
                title: title,
                content: `이곳은 ${title} 항목의 상세 내용 영역입니다.`,
                memos: {}
            }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }
        
        return items;
    }

    function renderList() {
        unbindSelectionAutoReset();
        const main = document.getElementById("mainContent");
        let items = getStoredItems();
        const itemsPerPage = getItemsPerPage();
        controlBar.style.display = "flex";
        paginationBar.style.display = "flex";

        const keyword = searchInput.value.trim().toLowerCase();
        if (keyword !== "") {
            items = items.filter(item => item.title.toLowerCase().includes(keyword));
        }

        const sortType = sortSelect.value;
        if (sortType === "newest") {
            items.sort((a, b) => b.id - a.id);
        } else if (sortType === "oldest") {
            items.sort((a, b) => a.id - b.id);
        } else if (sortType === "title") {
            items.sort((a, b) => a.title.localeCompare(b.title, "ko"));
        }
        
        main.innerHTML = "";

        if (items.length === 0) {
            main.innerHTML = `<div class="no-results">검색 결과가 없습니다.</div>`;
            paginationBar.innerHTML = "";
            return;
        }

        const totalPages = Math.ceil(items.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageItems = items.slice(startIndex, startIndex + itemsPerPage);
        
        pageItems.forEach((item) => {
            const a = document.createElement("a");
            a.className = "title";
            a.textContent = item.title;
            a.href = "#";
            
            a.addEventListener("click", (e) => {
                e.preventDefault();
                renderDetail(item.id);
            });
            
            main.appendChild(a);
        });

        renderPagination(totalPages);
    }

    function getItemsPerPage() {
        const width = window.innerWidth;
        if (width <= 600) return 33;
        else if (width <= 1024) return 44;
        else return 50;
    }

    function renderPagination(totalPages) {
        paginationBar.innerHTML = "";

        const prevBtn = document.createElement("button");
        prevBtn.className = "page-btn";
        prevBtn.textContent = "‹";
        prevBtn.disabled = currentPage === 1;
        prevBtn.addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                renderList();
            }
        });
        paginationBar.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement("button");
            pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.textContent = i;
            pageBtn.addEventListener("click", () => {
                currentPage = i;
                renderList();
            });
            paginationBar.appendChild(pageBtn);
        }

        const nextBtn = document.createElement("button");
        nextBtn.className = "page-btn";
        nextBtn.textContent = "›";
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.addEventListener("click", () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderList();
            }
        });
        paginationBar.appendChild(nextBtn);
    }

    function renderDetail(id, options = {}) {
        unbindSelectionAutoReset();
        activeDetailId = id;
        const main = document.getElementById("mainContent");
        controlBar.style.display = "none";
        paginationBar.style.display = "none";

        let isNew = !!options.isNew;
        const items = getStoredItems();
        let item = isNew ? { id: id, title: "", content: "", memos: {} } : items.find(i => i.id === id);
        let isEditing = isNew;

        function enterEditModeBindings() {
            document.getElementById("titleInput").focus();
            bindSelectionAutoReset('detailInput');
        }

        function drawUI() {
            const safeTitle = item.title;
            const safeContent = item.content;
            const parsedHtml = parseWikiLinks(safeContent);

            main.innerHTML = `
                <div class="detailView">
                    <div class="detailHeader">
                        ${isEditing 
                            ? `<input type="text" class="detailTitleInput" id="titleInput" value="${safeTitle}" maxlength="30" spellcheck="false" autocomplete="off" />`
                            : `<h2>${safeTitle}</h2>`
                        }
                        <div class="detailTopBtns">
                            <button class="btnTopAction" id="btnEdit">${isEditing ? '취소' : '수정'}</button>
                            <button class="btnTopAction btnDelete" id="btnDelete">삭제</button>
                        </div>
                    </div>
                    <div class="detailBody">
                        ${isEditing 
                            ? `
                                <div class="format-toolbar">
                                    <button type="button" class="fmt-btn" style="font-weight:700;" onmousedown="event.preventDefault()" onclick="toggleBold('detailInput')">굵게</button>
                                    <span class="fmt-divider">|</span>
                                    <select class="fmt-select" onmousedown="saveCurrentSelection('detailInput')" onchange="applyFontSize('detailInput', this.value); this.selectedIndex = 0;">
                                        <option value="" disabled selected>크기</option>
                                        <option value="14">작게</option>
                                        <option value="18">보통</option>
                                        <option value="24">크게</option>
                                        <option value="32">아주 크게</option>
                                    </select>
                                    <span class="fmt-divider">|</span>
                                    <div class="fmt-color-group">
                                        <button type="button" class="fmt-color-swatch" style="background:#000000" title="검정" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#000000')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#868e96" title="회색" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#868e96')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#e03131" title="빨강" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#e03131')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#f76707" title="주황" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#f76707')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#f5c211" title="노랑" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#f5c211')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#2f9e44" title="초록" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#2f9e44')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#0c8599" title="청록" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#0c8599')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#1971c2" title="파랑" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#1971c2')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#9c36b5" title="보라" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#9c36b5')"></button>
                                        <button type="button" class="fmt-color-swatch" style="background:#e64980" title="분홍" onmousedown="event.preventDefault()" onclick="applyColor('detailInput', '#e64980')"></button>
                                    </div>
                                </div>
                                <div class="editable-box" id="detailInput" contenteditable="true" spellcheck="false">${safeContent}</div>
                              `
                            : `<div class="detailText" id="detailTextView">${parsedHtml}</div>`
                        }
                    </div>
                    <div class="detailFooter">
                        <button class="btnBack" id="btnBack">목록으로 돌아가기</button>
                        ${isEditing ? `<button class="btnBack btnSave" id="btnSave">저장</button>` : ''}
                    </div>
                </div>
            `;

            document.getElementById("btnBack").addEventListener("click", renderList);

            document.getElementById("btnDelete").addEventListener("click", () => {
                targetDeleteId = id;
                deleteModalText.textContent = `'${item.title}' 항목을 삭제하시겠습니까?`;
                openDeleteModal();
            });

            document.getElementById("btnEdit").addEventListener("click", () => {
                if (isEditing && isNew) {
                    // 저장 전인 새 항목을 취소하면 만들다 만 빈 항목을 남기지 않고 목록으로 돌아감
                    renderList();
                    return;
                }
                if (isEditing) unbindSelectionAutoReset();
                isEditing = !isEditing;
                drawUI();
                if (isEditing) enterEditModeBindings();
            });

            if (!isEditing) {
                const wikiLinks = document.querySelectorAll("#detailTextView .wiki-link");
                wikiLinks.forEach(link => {
                    link.addEventListener("click", () => {
                        const word = link.getAttribute("data-word");
                        openWordMemoModal(id, word);
                    });
                });
            }

            if (isEditing) {
                document.getElementById("btnSave").addEventListener("click", () => {
                    const newTitle = document.getElementById("titleInput").value.trim();
                    const newContent = document.getElementById("detailInput").innerHTML;

                    if (newTitle === "") {
                        document.getElementById("titleInput").focus();
                        return;
                    }

                    const currentItems = getStoredItems();
                    const targetIndex = currentItems.findIndex(i => i.id === id);
                    if (targetIndex !== -1) {
                        currentItems[targetIndex].title = newTitle;
                        currentItems[targetIndex].content = newContent;
                    } else {
                        currentItems.push({ id: id, title: newTitle, content: newContent, memos: {} });
                    }
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentItems));

                    item.title = newTitle;
                    item.content = newContent;
                    isNew = false;

                    unbindSelectionAutoReset();
                    isEditing = false;
                    drawUI();
                });
            }
        }

        drawUI();
        if (isEditing) enterEditModeBindings();
    }

    // 단어 추가 메모 모달 관련 함수
    function openWordMemoModal(itemId, word) {
        currentEditingWord = { itemId, word };
        const items = getStoredItems();
        const item = items.find(i => i.id === itemId);
        const memoContent = (item && item.memos && item.memos[word]) ? item.memos[word] : "";
        
        wordMemoModalTitle.textContent = `'${word}' 추가 메모`;
        isMemoEditing = (memoContent.trim() === "");
        
        renderWordMemoContent(memoContent);
        wordMemoModalOverlay.classList.add("active");
    }

    function renderWordMemoContent(content) {
        const container = document.getElementById("wordMemoContainer");
        const btnsContainer = document.getElementById("wordMemoBtns");

        if (isMemoEditing) {
            container.innerHTML = `
                <textarea class="modal-textarea" id="wordMemoTextarea" placeholder="추가 메모를 입력하세요" style="height: 360px; resize: none;">${content}</textarea>
            `;
            btnsContainer.innerHTML = `
                <button class="btn-modal btn-cancel" id="btnWordMemoCancel">취소</button>
                <button class="btn-modal btn-submit" id="btnWordMemoSave">저장</button>
            `;
            document.getElementById("btnWordMemoCancel").addEventListener("click", closeWordMemoModal);
            document.getElementById("btnWordMemoSave").addEventListener("click", saveWordMemo);
            document.getElementById("wordMemoTextarea").focus();
        } else {
            container.innerHTML = `
                <div class="modal-textarea" id="wordMemoDisplay" style="height: 360px; overflow-y: auto; white-space: pre-wrap; background: #fff; cursor: default; user-select: text;">${content || "등록된 메모가 없습니다."}</div>
            `;
            btnsContainer.innerHTML = `
                <button class="btn-modal btn-cancel" id="btnWordMemoClose">닫기</button>
                <button class="btn-modal btn-submit" id="btnWordMemoEdit">수정</button>
            `;
            document.getElementById("btnWordMemoClose").addEventListener("click", closeWordMemoModal);
            document.getElementById("btnWordMemoEdit").addEventListener("click", () => {
                isMemoEditing = true;
                renderWordMemoContent(content);
            });
        }
    }

    function saveWordMemo() {
        const textarea = document.getElementById("wordMemoTextarea");
        if (!textarea || !currentEditingWord) return;
        const newMemo = textarea.value;

        const items = getStoredItems();
        const item = items.find(i => i.id === currentEditingWord.itemId);
        if (item) {
            if (!item.memos) item.memos = {};
            item.memos[currentEditingWord.word] = newMemo;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        closeWordMemoModal();
        renderDetail(currentEditingWord.itemId);
    }

    function closeWordMemoModal() {
        wordMemoModalOverlay.classList.remove("active");
        currentEditingWord = null;
    }

    function openDeleteModal() {
        deleteModalOverlay.classList.add("active");
    }

    function closeDeleteModal() {
        deleteModalOverlay.classList.remove("active");
        targetDeleteId = null;
    }

    function confirmDelete() {
        if (targetDeleteId !== null) {
            let items = getStoredItems();
            items = items.filter(i => i.id !== targetDeleteId);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            closeDeleteModal();
            renderList();
        }
    }

    // Event Listeners
    searchInput.addEventListener("input", () => {
        currentPage = 1;
        renderList();
    });

    window.addEventListener("resize", () => {
        renderList();
    });

    sortSelect.addEventListener("change", () => {
        currentPage = 1;
        renderList();
    });

    document.getElementById("btnNew").addEventListener("click", () => {
        renderDetail(Date.now(), { isNew: true });
    });

    btnDeleteCancel.addEventListener("click", closeDeleteModal);
    btnDeleteConfirm.addEventListener("click", confirmDelete);

    deleteModalOverlay.addEventListener("click", (e) => {
        if (e.target === deleteModalOverlay) closeDeleteModal();
    });

    wordMemoModalOverlay.addEventListener("click", (e) => {
        if (e.target === wordMemoModalOverlay) closeWordMemoModal();
    });

    document.getElementById("headerTitle").addEventListener("click", () => {
        searchInput.value = "";
        sortSelect.value = "oldest";
        currentPage = 1;
        renderList();
    });

    // 초기 렌더링 실행
    renderList();
</script>
</body>
</html>
